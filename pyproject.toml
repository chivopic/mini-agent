[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chiv-mini-agent"
version = "0.2.0"
description = "A lightweight CLI coding assistant agent"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Chiv", email = "2350288304@qq.com" },
]
keywords = ["ai", "agent", "cli", "coding-assistant", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
mini-agent = "mini_agent.main:main"

[project.urls]
Homepage = "https://github.com/chenzh659/mini-agent"
Repository = "https://github.com/chenzh659/mini-agent"
Issues = "https://github.com/chenzh659/mini-agent/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/docs",
    "/CLAUDE_CODE_EXECUTION_SPEC.md",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
