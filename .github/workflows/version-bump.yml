name: Version Bump

on:
  push:
    branches: [fix/security-hardening-v0.2.1]
    paths:
      - .github/workflows/version-bump.yml

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/security-hardening-v0.2.1
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Bump source version
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "pyproject.toml": [('version = \"0.2.0\"', 'version = \"0.2.1\"')],
              "src/mini_agent/__init__.py": [('__version__ = \"0.2.0\"', '__version__ = \"0.2.1\"')],
              "src/mini_agent/cli.py": [('content.append(\"  v0.2.0\\n\", style=\"dim\")', 'content.append(\"  v0.2.1\\n\", style=\"dim\")')],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"expected version marker not found in {filename}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Refresh lockfile
        run: uv lock

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock src/mini_agent/__init__.py src/mini_agent/cli.py
          git diff --cached --check
          git commit -m "chore: bump version to 0.2.1"
          git push origin HEAD:fix/security-hardening-v0.2.1
