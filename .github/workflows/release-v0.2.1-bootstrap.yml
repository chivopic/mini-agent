name: Release v0.2.1 Bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.2.1-bootstrap.yml

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

  release:
    name: Publish v0.2.1 and self-clean
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify version and build distributions
        shell: bash
        run: |
          PACKAGE_VERSION="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "${PACKAGE_VERSION}" = "0.2.1"
          uv build

      - name: Remove bootstrap workflow and create release tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/release-v0.2.1-bootstrap.yml
          git add -u .github/workflows/release-v0.2.1-bootstrap.yml
          git commit -m "ci: remove v0.2.1 release bootstrap"
          git push origin HEAD:main
          git tag -a v0.2.1 -m "v0.2.1"
          git push origin v0.2.1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create v0.2.1 dist/* --verify-tag --generate-notes --title "v0.2.1"
